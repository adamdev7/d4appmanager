# App Manager ONLY — appmanager.store
#
# This VPS also serves d4technology.ca. Leave that site file alone.
# Do not copy these blocks into the d4technology.ca nginx config.
# Do not add default_server here (that would steal unmatched HTTPS from the other site).
#
# Install (after git pull on the VPS):
#   sudo cp /var/www/appmanager/deploy/nginx-appmanager.store.conf /etc/nginx/sites-available/appmanager.store
#   sudo ln -sf /etc/nginx/sites-available/appmanager.store /etc/nginx/sites-enabled/appmanager.store
#   sudo certbot certonly --nginx -d appmanager.store -d www.appmanager.store
#   sudo nginx -t && sudo systemctl reload nginx
#
# proxy_pass must have NO trailing slash or /api is stripped (login 405 / HTML-as-JSON).

server {
    listen 80;
    listen [::]:80;
    server_name appmanager.store www.appmanager.store;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://appmanager.store$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name appmanager.store www.appmanager.store;

    ssl_certificate     /etc/letsencrypt/live/appmanager.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appmanager.store/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/appmanager/frontend/dist;
    index index.html;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
